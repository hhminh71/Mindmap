<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VCA Visualizer - Phòng TC-KH</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-view"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.17.0/dist/browser/index.js"></script>
<style>
    body { margin: 0; display: flex; height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f7fa; overflow: hidden; }
    .sidebar { flex: 1; min-width: 300px; max-width: 350px; background: white; padding: 20px; display: flex; flex-direction: column; gap: 15px; box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index: 100; border-right: 1px solid #ddd; }
    .main-content { flex: 3; display: flex; flex-direction: column; background: #fff; position: relative; }
    .vca-header { background: #0056b3; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid #d4af37; }
    .vca-header h2 { margin: 0; font-size: 16px; text-transform: uppercase; line-height: 1.2; }
    .vca-header span { font-size: 11px; opacity: 0.9; }
    .upload-box { border: 2px dashed #0056b3; padding: 30px 10px; text-align: center; border-radius: 8px; background: #f0f8ff; cursor: pointer; transition: 0.3s; }
    .upload-box:hover { background: #e1f0ff; border-color: #d4af37; }
    .btn-action { background: #0056b3; color: white; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .btn-action:hover { background: #003d82; }
    .btn-action:disabled { background: #ccc; cursor: not-allowed; }
    .btn-download { background: #d4af37; color: #000; border: none; padding: 8px 15px; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 12px; }
    #markmap-container { flex-grow: 1; width: 100%; height: 100%; background: #f8f9fa; }
    #status { font-size: 13px; text-align: center; font-weight: bold; }
    #fileName { font-size: 12px; color: #555; margin-top: 5px; word-break: break-all; }
</style>
</head>
<body>

<div class="sidebar">
    <div style="text-align: center; border-bottom: 1px solid #eee; padding-bottom: 10px;">
        <h3 style="color: #0056b3; margin: 0;">VCA SMART VISUALIZER</h3>
        <p style="font-size: 11px; color: #666; margin: 5px 0;">Trợ lý số hóa Phòng Tài chính - Kế hoạch</p>
    </div>
    
    <div class="upload-box" id="drop-zone" onclick="document.getElementById('fileInput').click()">
        <p style="margin: 0; font-weight: bold; font-size: 14px;">Kéo thả file vào đây</p>
        <p style="margin: 5px 0 0; font-size: 11px; color: #777;">Hỗ trợ PDF, DOCX, TXT</p>
        <div id="fileName">Chưa chọn file</div>
        <input type="file" id="fileInput" style="display: none;" accept=".pdf,.docx,.doc,.txt">
    </div>
    
    <button class="btn-action" id="btnGenerate" onclick="processFile()" disabled>TẠO SƠ ĐỒ MINDMAP</button>
    <div id="status"></div>
</div>

<div class="main-content">
    <div class="vca-header">
        <div>
            <span>TỔNG CÔNG TY CẢNG HÀNG KHÔNG VIỆT NAM - CTCP</span>
            <h2>Cảng HKQT Cần Thơ | Trợ lý Số hóa</h2>
        </div>
        <button class="btn-download" onclick="downloadImage()">TẢI ẢNH (PNG)</button>
    </div>
    <div id="markmap-container">
        <svg id="markmap-svg" style="width: 100%; height: 100%"></svg>
    </div>
</div>

<script>
    let selectedFile = null;
    const { markmap } = window;
    const { Transformer, Markmap } = markmap;

    // Xử lý chọn file
    document.getElementById('fileInput').onchange = (e) => {
        selectedFile = e.target.files[0];
        if (selectedFile) {
            document.getElementById('fileName').innerText = selectedFile.name;
            document.getElementById('btnGenerate').disabled = false;
            document.getElementById('status').innerText = "File đã sẵn sàng!";
            document.getElementById('status').style.color = "green";
        }
    };

    // Xử lý kéo thả
    const dropZone = document.getElementById('drop-zone');
    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.style.background = "#e1f0ff"; };
    dropZone.ondragleave = () => { dropZone.style.background = "#f0f8ff"; };
    dropZone.ondrop = (e) => {
        e.preventDefault();
        dropZone.style.background = "#f0f8ff";
        selectedFile = e.dataTransfer.files[0];
        document.getElementById('fileName').innerText = selectedFile.name;
        document.getElementById('btnGenerate').disabled = false;
    };

    // Hàm chính gửi file và vẽ map
    async function processFile() {
        const status = document.getElementById('status');
        const btn = document.getElementById('btnGenerate');
        
        status.innerText = "Đang đọc và phân tích tài liệu...";
        status.style.color = "blue";
        btn.disabled = true;

        const formData = new FormData();
        formData.append("file", selectedFile);

        try {
            const response = await fetch('/api/generate', { method: 'POST', body: formData });
            const data = await response.json();

            if (data.markdown) {
                renderMindmap(data.markdown);
                status.innerText = "Hoàn thành thành công!";
                status.style.color = "green";
            } else {
                status.innerText = "Lỗi: " + (data.error || "Không có dữ liệu");
                status.style.color = "red";
            }
        } catch (err) {
            status.innerText = "Lỗi kết nối máy chủ!";
            status.style.color = "red";
        } finally {
            btn.disabled = false;
        }
    }

    // Hàm vẽ sơ đồ
    function renderMindmap(markdown) {
        const svg = document.querySelector('#markmap-svg');
        svg.innerHTML = ''; // Xóa cái cũ
        const transformer = new Transformer();
        const { root } = transformer.transform(markdown);
        Markmap.create(svg, {
            autoFit: true,
            padding: 20,
            duration: 500,
        }, root);
    }

    // Hàm tải ảnh sơ đồ
    function downloadImage() {
        const svg = document.querySelector('#markmap-svg');
        const serializer = new XMLSerializer();
        const source = '<?xml version="1.0" standalone="no"?>\r\n' + serializer.serializeToString(svg);
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const img = new Image();
        img.src = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(source)));
        img.onload = function() {
            canvas.width = img.width * 2;
            canvas.height = img.height * 2;
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const a = document.createElement("a");
            a.download = "VCA_Mindmap.png";
            a.href = canvas.toDataURL("image/png");
            a.click();
        };
    }
</script>
</body>
</html>
